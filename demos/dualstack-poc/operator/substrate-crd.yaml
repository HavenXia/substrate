# POC CRD: one cluster-scoped Substrate object describes the whole
# installation; editing spec.version triggers the dual-live upgrade. Parked
# under poc.ate.dev so the real ate.dev API stays unclaimed.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: substrates.poc.ate.dev
spec:
  group: poc.ate.dev
  names:
    kind: Substrate
    listKind: SubstrateList
    plural: substrates
    singular: substrate
    shortNames: ["sub"]
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Phase
      type: string
      jsonPath: .status.phase
    - name: Version
      type: string
      jsonPath: .spec.version
    - name: Message
      type: string
      jsonPath: .status.message
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required: [version]
            properties:
              version:
                type: string
                description: desired substrate stack version (e.g. 0.2.0)
              graceSeconds:
                type: integer
                default: 25
                minimum: 0
                description: seconds actors get between the SIGTERM and the worker-pod kill
              bundleDir:
                type: string
                description: operator-local dir holding crds.yaml, shared.yaml, stack-<v>.yaml; overrides --bundle-dir
          status:
            type: object
            properties:
              phase:
                type: string
              message:
                type: string
              activeVersion:
                type: string
              notifiedAt:
                type: string
              killed:
                type: array
                items:
                  type: string
              committed:
                type: array
                items:
                  type: string
